# Dev service: the devcontainer itself, built from .devcontainer/Dockerfile's
# `develop` stage, with the repo root as build context. The workspace is bind-mounted so source
# edits are picked up without a rebuild. An instance that adds backing
# services (a database, a queue, ...) adds its own `include:` list to
# compose.instance.yml instead, pointing at its own `stack/*/compose.yml`
# fragments -- see
# .devcontainer/README.md's "Docker-in-Docker vs. the host's Docker".
services:
  # Not `app`: Chrome HSTS-preloads the whole `.app` TLD, which also
  # matches the bare hostname `app`, so a browser container (e.g. an
  # instance's Selenium) would force http://app:<port> to HTTPS.
  myapp:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: develop
      # Optional: authenticates the image build's GitHub downloads (see
      # the Dockerfile and scripts/develop.sh). CI exports GITHUB_TOKEN;
      # when it is unset the secret is empty and downloads are
      # unauthenticated.
      secrets:
        - github_token
    volumes:
      - ..:/workspace:cached
      # No volume for a language-runtime environment (venv, node_modules,
      # target/, ...): a mounted one gets swept by Windows DLP/malware-
      # scanning tools just like a bind-mounted one, so it lives purely in
      # the container's writable layer instead -- see each language's own
      # README for its specific env var/path convention once an instance
      # adds one.
      - claude-config:/home/vscode/.claude
      - gh-config:/home/vscode/.config/gh
    command: sleep infinity
    # No ports: mapping and no networks: block — see .devcontainer/
    # README.md's "Don't". An instance that needs host access adds
    # forwardPorts to devcontainer.json; one with backing services
    # reaches them by name on the default network compose generates for
    # this project.

volumes:
  # Persists Claude Code CLI session/credential state across container
  # rebuilds. A small amount of session-state data, not a language
  # runtime's dependency tree, so the DLP/malware-scanning concern above
  # doesn't apply the same way here.
  claude-config:
  # Persists the GitHub CLI's login (`gh auth login`) across rebuilds, for
  # the same reason.
  gh-config:

secrets:
  github_token:
    environment: GITHUB_TOKEN
