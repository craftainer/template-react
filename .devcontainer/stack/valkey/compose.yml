# Stack service: Valkey, the BFF's session store, reachable only from other
# containers on the compose-generated default network (see ../README.md).
services:
  valkey:
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valkey-data:
