# Lint/type-check/test gate: runs every prek hook, fast and extensive,
# inside the same devcontainer used for local development.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
          - arch: arm64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unique per run so concurrent runs (two PRs, or a re-run) never
      # collide on container/volume/network names, and so the teardown
      # step below tears down exactly this run's stack and nothing else.
      - name: Set compose project name
        run: echo "COMPOSE_PROJECT_NAME=ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Warms the Buildx layer cache for the devcontainer image (the
      # `develop` stage below) before devcontainers/ci builds it via
      # `docker compose build`. Same context/target/Dockerfile as the dev
      # service in .devcontainer/compose.yml, so cache keys line up; no
      # push/load since this step only needs to populate the cache, not
      # produce a usable image.
      - name: Warm devcontainer image build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: develop
          # Same optional secret compose.yml passes (see the Dockerfile).
          secret-envs: github_token=GITHUB_TOKEN
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Optional instance script: a template that ships
      # .github/scripts/semver_release_type.py (template-rust-crate) gets
      # SEMVER_RELEASE_TYPE=major for a `!`-marked PR title (or, on main, head
      # commit subject), which the hooks step forwards into the container.
      # Base ships no such script, so the step is skipped here. The title and
      # message are attacker-controlled and so reach the script only as
      # environment variables, never interpolated into `run:`.
      - name: Pick the semver-checks release type
        if: hashFiles('.github/scripts/semver_release_type.py') != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # The script's stdout is appended to $GITHUB_ENV, so a stray or
          # injected line (a newline in a value, another variable name) would
          # set arbitrary environment for later steps. Accept nothing but
          # empty output or the single expected assignment (the value may be empty:
          # the consuming hook falls back to minor).
          out="$(python3 -I .github/scripts/semver_release_type.py)"
          if [ -n "$out" ] && ! [[ "$out" =~ ^SEMVER_RELEASE_TYPE=(major|minor|patch)?$ ]]; then
            echo "::error::semver_release_type.py printed something other than SEMVER_RELEASE_TYPE=[major|minor|patch]" >&2
            exit 1
          fi
          [ -z "$out" ] || printf '%s\n' "$out" >> "$GITHUB_ENV"

      # --hook-stage manual runs every hook (both the fast pre-commit-stage
      # ones and the extensive pre-push-stage ones) in one pass, inside the
      # devcontainer -- the same environment (uv, prek, playwright, ...) a
      # contributor develops in, not a hand-rolled CI-only equivalent.
      - name: Run all hooks in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # Build-time only: compose.yml's `github_token` build secret, so
          # the image build's GitHub downloads are authenticated and not
          # rate-limited (HTTP 429). Not forwarded into the container.
          GITHUB_TOKEN: ${{ github.token }}
          # Forwarded (see `env:` below) so zizmor runs its online audits
          # too; locally, without a token, it runs offline. The workflow's
          # `contents: read` is all zizmor's docs ask of the token.
          GH_TOKEN: ${{ github.token }}
        with:
          runCmd: prek run --all-files --hook-stage manual
          # SEMVER_RELEASE_TYPE comes from the step above; devcontainers/ci
          # omits a name that is unset or empty, so the hooks' own default
          # applies (and base, which has no such step, is unaffected).
          env: |
            GH_TOKEN
            SEMVER_RELEASE_TYPE

      # devcontainers/ci starts the full compose stack (see
      # .devcontainer/devcontainer.json's dockerComposeFile) but never
      # tears it down -- that's fine for a throwaway CI VM, but this repo
      # wants a clean, explicit teardown regardless. Selecting the stack
      # by project name alone (no -f list) also covers any services an
      # instance adds through compose.instance.yml's `include:`.
      - name: Tear down devcontainer stack
        if: always()
        # COMPOSE_PROJECT_NAME is unset when an earlier step failed before
        # "Set compose project name"; then no stack was started either.
        run: |
          if [ -z "${COMPOSE_PROJECT_NAME:-}" ]; then
            echo "No compose project name set; nothing to tear down."
            exit 0
          fi
          docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans
