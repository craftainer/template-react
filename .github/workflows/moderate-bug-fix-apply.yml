# Privileged half of the bug-fix pipeline: consumes the artifact produced
# by moderate-bug-fix.yml (a git patch + outcome metadata -- data, never
# anything executed) and does the actual push/PR/relabel. Splitting this
# out of the Claude-running job is what closes CodeQL's
# actions/untrusted-checkout alert: a job that both runs Claude against
# untrusted issue text and holds push/PR/label-write credentials is
# exactly what that rule flags. See ../workflows/README.md's "Issue
# moderation" section.
name: Moderate bug fix apply

on:
  workflow_run:
    workflows: ["Moderate bug fix"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  apply:
    if: github.event.workflow_run.conclusion == 'success'
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # A triggering run can conclude `success` without having produced a
      # result: its gate/build job was skipped (an unrelated comment, a
      # missing label, no ANTHROPIC_API_KEY...), so no artifact was ever
      # uploaded. actions/download-artifact has no "if not found" option
      # and fails the step in that case, so look the artifact up first
      # and run the rest only when it exists. The download itself stays
      # strict, so a real failure (API error, digest mismatch) still
      # fails the job.
      - name: Check for moderation result
        id: result
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/find_moderation_result.sh "$REPO" "$RUN_ID"

      - name: Download moderation result
        if: steps.result.outputs.found == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: moderation-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: moderation-result

      - name: Apply result
        if: steps.result.outputs.found == 'true'
        run: |
          .github/scripts/moderate_apply_result.sh \
            moderation-result \
            bug repro \
            "bug:repro-ready" "bug:confirmed" "bug:fixed" \
            Fixes
