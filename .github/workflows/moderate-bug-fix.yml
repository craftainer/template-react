# Claude-driven fix once a maintainer confirms the repro branch
# by applying the `bug:confirm` label -- see ../workflows/README.md's
# "Issue moderation" section for the design. One workflow, two jobs: `fix`
# runs Claude against the issue's untrusted text with a read-only token and
# packages the result; `apply` (separate job, own token) pushes/opens the
# PR/relabels from that data artifact. Dormant (jobs show Skipped, not
# Failed) unless the ANTHROPIC_API_KEY repository secret is configured.
name: Moderate bug fix

# `labeled` is the trigger, not `issue_comment` (a comment can come from
# anyone who can see the issue): only a user with triage permission or
# above can add a label, so the run is always initiated by a privileged
# user. There is deliberately no `workflow_run` hand-off either -- the
# privileged half is the `apply` job below, fed only by a data artifact.
on:
  issues:
    types: [labeled]

# Read-only by default: the `fix` job runs Claude against the issue's
# (untrusted) title, body, and comments, so it must never also hold
# push/PR/label-write credentials. Only the `apply` job below widens its
# own permissions, and it never runs Claude or any PR-controlled code.
permissions:
  contents: read

# Same group as the triage and cleanup workflows so they serialize per
# issue. Unrelated label events get their own throwaway group: otherwise
# they would queue in (and, as a newer pending run, displace a queued
# confirm run from) the issue's group.
concurrency:
  group: ${{ github.event.label.name == 'bug:confirm' && format('moderate-issue-{0}', github.event.issue.number) || format('moderate-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # secrets.* isn't readable from jobs.<job_id>.if (GitHub rejects the
  # workflow as invalid), only from a step or jobs.<job_id>.env -- so the
  # trust gate below reads this job's output instead. See
  # ../workflows/README.md's "Issue moderation" section.
  gate:
    if: github.event.label.name == 'bug:confirm'
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
      repro-sha: ${{ steps.resolve-sha.outputs.sha }}
    # issues: write consumes the label; contents: read lets resolve-sha
    # read the branch tip (a job-level block replaces the workflow-level one).
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Consumes the confirm label first, so a failed or skipped run never
      # leaves it stuck (`labeled` fires only when a label is added): the
      # maintainer re-adds it to retry. Re-adding it during this run queues
      # the next run under the concurrency group above.
      - name: Consume the confirm label
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "bug:confirm"
      - id: check
        run: echo "has-key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      # Resolves the repro branch's tip as early as possible and pins the
      # rest of this run to that commit (see checkout step below) rather
      # than the mutable branch name -- otherwise a push to the branch
      # between this trust check and the later checkout step would run
      # under this job's secrets untested (CodeQL
      # actions/untrusted-checkout-toctou). Silently empty when the
      # branch doesn't exist; the `fix` job's own trust condition
      # still gates whether that's used.
      - id: resolve-sha
        run: |
          sha=$(gh api "repos/${{ github.repository }}/commits/bug/${{ github.event.issue.number }}-repro" --jq .sha 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  fix:
    needs: gate
    # The label was added by a triage+ user (the only ones who can), the
    # stage label shows triage left it awaiting confirmation, and the
    # issue itself is from a trusted author or carries the maintainer
    # opt-in `claude:ok`.
    if: >-
      ${{ needs.gate.outputs.has-key == 'true' &&
      contains(github.event.issue.labels.*.name, 'bug:repro-ready') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
       contains(github.event.issue.labels.*.name, 'claude:ok')) }}
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out repro branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.repro-sha }}

      # Unique per run so concurrent runs never collide on
      # container/volume/network names, and so the teardown step below tears
      # down exactly this run's stack. Mirrors checks.yml.
      - name: Set compose project name
        run: echo "COMPOSE_PROJECT_NAME=ci-moderate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Write Claude API key
        run: |
          install -m 600 /dev/null .secrets/claude.txt
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" > .secrets/claude.txt

      - name: Run Claude bug fix
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: >-
            .github/scripts/run_claude.sh
            .github/scripts/prompts/bug-fix.md
            "Read,Grep,Glob,Write,Edit,Bash(git *),Bash(prek run *)${{ vars.MODERATION_EXTRA_TOOLS && format(',{0}', vars.MODERATION_EXTRA_TOOLS) || '' }}"
            40 900
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Remove Claude API key
        if: always()
        run: rm -f .secrets/claude.txt

      # Always packages/uploads, even if Claude's step above failed or
      # timed out, so the apply job still gets a "failed" outcome and
      # can comment on the issue instead of it going silently stuck.
      - name: Package result for the apply job
        if: always()
        env:
          RESULT_SHA: ${{ needs.gate.outputs.repro-sha }}
        run: |
          .github/scripts/moderate_package_result.sh \
            "$RESULT_SHA" \
            moderation-result \
            .moderation-outcome.md

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moderation-result
          path: moderation-result
          retention-days: 1

      - name: Tear down devcontainer stack
        if: always()
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            down --volumes --remove-orphans

  # Privileged half: consumes only the data artifact above (a git patch +
  # outcome metadata, never executed) and does the push/PR/relabel. Runs on
  # the default branch's workflow definition and checkout (an `issues`
  # event), never on the issue branch, and never runs Claude.
  # `always()` so a failed or timed-out Claude step still gets its
  # "failed" outcome applied; skipped (gate closed, no API key, issue not
  # trusted) means there is nothing to apply.
  apply:
    needs: fix
    if: ${{ !cancelled() && needs.fix.result != 'skipped' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `fix` job uploads in an `if: always()` step, so a missing
      # artifact means it died before packaging (runner crash, upload
      # error) -- handled by the "Report" step below rather than failing
      # silently, hence continue-on-error here.
      - name: Download moderation result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: moderation-result
          path: moderation-result

      # Checkout doesn't persist credentials; git push/fetch use gh's
      # credential helper, fed by GH_TOKEN.
      - name: Configure git credentials
        run: gh auth setup-git

      - name: Report a missing moderation result
        if: steps.download.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label needs-human || true
          gh issue comment "$ISSUE_NUMBER" --body "No result artifact (missing or download error; download step: $DOWNLOAD_OUTCOME). The run likely failed before packaging one. See $RUN_URL. Re-add the confirm label to retry." || true
          exit 1

      - name: Apply result
        if: steps.download.outcome == 'success'
        run: |
          .github/scripts/moderate_apply_result.sh \
            moderation-result \
            bug repro \
            "bug:repro-ready" "bug:fixed" \
            Fixes
