# Claude-driven first triage of a bug report -- see
# ../workflows/README.md's "Issue moderation" section for the full state
# machine and the threat model (docs/adrs/0001-harden-the-issue-moderation-workflows.md).
# One workflow, three jobs: `gate` (is the feature configured), `triage`
# (Claude against the issue's untrusted text, with a READ-ONLY token) and
# `apply` (no Claude, no untrusted code: validates the result artifact, then
# pushes the repro branch, comments and labels).
# Dormant (jobs show Skipped, not Failed) unless the ANTHROPIC_API_KEY
# repository secret is configured.
name: Moderate bug triage

on:
  issues:
    types: [opened, reopened]

# Least privilege: every job declares its own scopes below.
permissions: {}

concurrency:
  group: moderate-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # secrets.* isn't readable from jobs.<job_id>.if (GitHub rejects the
  # workflow as invalid), only from a step or jobs.<job_id>.env -- so the
  # trust gate below reads this job's output instead. See
  # ../workflows/README.md's "Issue moderation" section.
  gate:
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        run: echo "has-key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  triage:
    needs: gate
    if: >-
      ${{ needs.gate.outputs.has-key == 'true' &&
      contains(github.event.issue.labels.*.name, 'bug') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
       contains(github.event.issue.labels.*.name, 'claude:ok')) }}
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    # Read-only: this job runs Claude against the issue's (untrusted) text, so
    # whatever a prompt injection reaches must not be able to push, comment or
    # label. `issues: read` is for `gh issue view`.
    permissions:
      contents: read
      issues: read
    env:
      GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      # A snapshot outside the workspace (and so outside the devcontainer's
      # bind mount) of the default branch: everything run on the runner or
      # copied in below comes from it, never from the tree Claude edits.
      # `issues` events run on the default branch's latest commit.
      - name: Snapshot the trusted tooling
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/trusted"
          git archive "$TRUSTED_SHA" | tar -x -C "$RUNNER_TEMP/trusted"
          "$RUNNER_TEMP/trusted/.github/scripts/moderate_prepare.sh" "$RUNNER_TEMP/trusted"

      # Unique per run so concurrent runs never collide on
      # container/volume/network names, and so the teardown step below tears
      # down exactly this run's stack. Mirrors checks.yml.
      - name: Set compose project name
        run: echo "COMPOSE_PROJECT_NAME=ci-moderate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      # The API key reaches the container only through `with: env:` (-> `devcontainer
      # exec --remote-env`), i.e. the environment of this one command. A
      # step-level `env:` alone is NOT forwarded into the container.
      - name: Run Claude bug triage
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # Build-time only (compose.yml's `github_token` build secret): not
          # in the `with: env:` list below, so not forwarded into the container.
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODERATION_EXTRA_TOOLS: ${{ vars.MODERATION_EXTRA_TOOLS }}
          # Hosts the sandbox lets Claude's commands reach (everything else is refused).
          MODERATION_ALLOWED_DOMAINS: github.com,api.github.com${{ vars.MODERATION_EXTRA_DOMAINS && format(',{0}', vars.MODERATION_EXTRA_DOMAINS) || '' }}
        with:
          runCmd: >-
            .moderation-tools/run_claude.sh
            .moderation-tools/prompts/bug-triage.md
            "Read,Grep,Glob,Write,Edit,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git add *),Bash(git commit *),Bash(git checkout -b *),Bash(git switch -c *),Bash(git restore *),Bash(git rm *),Bash(git mv *),Bash(git ls-files *),Bash(git rev-parse *),Bash(gh issue view *),Bash(gh repo view *),Bash(prek run --config .moderation-tools/pre-commit-config.yaml *)"
            15 120
          env: |
            ANTHROPIC_API_KEY
            GH_TOKEN
            MODERATION_EXTRA_TOOLS
            MODERATION_ALLOWED_DOMAINS
            GITHUB_ISSUE_NUMBER

      # Always packages/uploads, even if Claude's step above failed or
      # timed out, so the apply job still gets a "failed" outcome and
      # can comment on the issue instead of it going silently stuck.
      - name: Package result for the apply job
        if: always()
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/trusted/.github/scripts/moderate_package_result.sh" \
            "$BASE_SHA" \
            moderation-result \
            "$GITHUB_WORKSPACE" \
            triage

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moderation-result
          path: moderation-result
          retention-days: 1

      - name: Tear down devcontainer stack
        if: always()
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            down --volumes --remove-orphans

  # Privileged half: consumes only the data artifact above (outcome metadata
  # and a git patch, never executed) and does the push/comment/label. Runs on
  # the default branch's workflow definition and checkout (an `issues`
  # event), never runs Claude, and validates everything it reads.
  # `always()` so a failed or timed-out Claude step still gets its
  # "failed" outcome applied; skipped (gate closed, no API key, issue not
  # trusted) means there is nothing to apply.
  apply:
    needs: triage
    if: ${{ !cancelled() && needs.triage.result != 'skipped' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The `triage` job uploads in an `if: always()` step, so a missing
      # artifact means it died before packaging (runner crash, upload
      # error) -- handled by the "Report" step below rather than failing
      # silently, hence continue-on-error here.
      - name: Download moderation result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: moderation-result
          path: moderation-result

      # Checkout doesn't persist credentials; git push/fetch use gh's
      # credential helper, fed by GH_TOKEN.
      - name: Configure git credentials
        run: gh auth setup-git

      # Whatever state this issue was in before it was closed, reopening it
      # restarts triage from scratch rather than resuming stale state -- see
      # ../workflows/README.md. Runs here, not in the Claude job, because it
      # edits labels and deletes branches.
      - name: Reset stale triage state on reopen
        if: github.event.action == 'reopened'
        run: .github/scripts/reset_issue_state.sh bug "$ISSUE_NUMBER"

      - name: Report a missing moderation result
        if: steps.download.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label needs-human || true
          gh issue comment "$ISSUE_NUMBER" --body "No result artifact (missing or download error; download step: $DOWNLOAD_OUTCOME). The run likely failed before packaging one. See $RUN_URL. Reopen the issue to restart triage." || true
          exit 1

      - name: Apply result
        if: steps.download.outcome == 'success'
        run: .github/scripts/moderate_apply_triage.sh bug moderation-result
