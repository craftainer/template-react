# Reconciles git/PR state left over by the issue-moderation pipeline once
# a bug/feature issue closes -- see ../workflows/README.md's "Issue
# moderation" section for the design. No trust gate and no Claude invocation: it only tidies up
# via `gh`/`git`, so there's no prompt-injection or spend surface to
# guard, and it stays unconditional even if ANTHROPIC_API_KEY is unset or
# later removed -- prior runs' branches/PRs still need cleaning up.
name: Moderate cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: moderate-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      ${{ contains(github.event.issue.labels.*.name, 'bug') ||
      contains(github.event.issue.labels.*.name, 'enhancement') }}
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checkout doesn't persist credentials; git push/fetch use gh's
      # credential helper, fed by GH_TOKEN.
      - name: Configure git credentials
        run: gh auth setup-git

      - name: Determine moderation branch name
        id: branch
        env:
          IS_BUG: ${{ contains(github.event.issue.labels.*.name, 'bug') }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$IS_BUG" = "true" ]; then
            echo "name=bug/$ISSUE_NUMBER-repro" >> "$GITHUB_OUTPUT"
          else
            echo "name=feature/$ISSUE_NUMBER-plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile PR/branch state for the closed issue
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          .github/scripts/moderate_cleanup.sh \
            "$BRANCH_NAME" \
            "$ISSUE_NUMBER"
