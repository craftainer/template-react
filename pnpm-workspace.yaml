# The Vite app is the root package; bff/ is its Node server, a private
# workspace member (see bff/README.md).
packages:
  - "."
  - "bff"
allowBuilds:
  # esbuild (pulled in by Storybook) ships its binary via per-platform optional
  # packages; its postinstall is only a fast-path optimisation.
  esbuild: false
# Our own libraries are released by us and consumed right away (UI layer
# follows each release); the age floor protects against third-party packages.
minimumReleaseAgeExclude:
  - "@craftainer/*"
# Dependabot alert #3 (minimatch GHSA, < 11.0.1): glob@13 (via Storybook's
# docgen plugin) pins minimatch ^10, which has no patched release. glob@14
# already uses minimatch 11, so the same API is in use; drop this override
# once glob 13 or its parent moves on.
overrides:
  "glob@13>minimatch": "11.0.8"
